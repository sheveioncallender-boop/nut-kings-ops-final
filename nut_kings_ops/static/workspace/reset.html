<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refresh Nut Kings Ops</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17120f;color:#fff;font-family:Arial,sans-serif}.box{width:min(520px,calc(100% - 32px));padding:28px;border-radius:20px;background:#fff;color:#17120f;text-align:center}.box img{max-width:220px}.spin{width:36px;height:36px;margin:22px auto;border:4px solid #eee;border-top-color:#ef1b23;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><img src="/nut_kings_ops/static/img/nut_kings_logo.png" alt="The Nut Kings"><h1>Refreshing Nut Kings Ops</h1><p>The application cache is being replaced. Saved offline transactions are not deleted.</p><div class="spin"></div><p id="status">Please wait…</p></div><script>(async()=>{try{const regs=await navigator.serviceWorker?.getRegistrations?.()||[];await Promise.all(regs.filter(r=>r.scope.includes('/nutkings/')).map(r=>r.unregister()));const keys=await caches.keys();await Promise.all(keys.filter(k=>k.startsWith('nut-kings-ops-')).map(k=>caches.delete(k)));document.getElementById('status').textContent='Updated. Reopening…';setTimeout(()=>location.replace('/nutkings/?refresh='+Date.now()),700)}catch(e){document.getElementById('status').textContent='Refresh failed: '+e.message}}</script></body></html>
